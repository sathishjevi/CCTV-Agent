# Floorwatch Coverage Skill — Configuration Schema
# Parsed by Aegis skill-registry-service.cjs → parseConfigYaml()
# Format: params[] with key, type, label, default, description, options

params:
  - key: auto_start
    label: Auto Start
    type: boolean
    default: false
    description: "Start this skill automatically when Aegis launches"

  - key: zones_dir
    label: Zones Directory
    type: string
    default: "zones"
    description: "Directory (relative to this skill) containing <camera_id>.json zone-polygon files"

  - key: person_class
    label: Person Class Name
    type: string
    default: "person"
    description: "Object class name treated as an occupant"

  - key: min_confidence
    label: Minimum Confidence
    type: number
    default: 0.5
    description: "Ignore upstream detections below this confidence before zone-mapping"

  - key: anchor_point
    label: Bbox Anchor Point
    type: select
    default: bottom_center
    description: "Which point of a person's bounding box is tested against zone polygons"
    options:
      - { value: bottom_center, label: "Bottom Center (feet)" }
      - { value: center, label: "Box Center" }

  - key: debounce_seconds
    label: Gap Debounce Window
    type: number
    default: 60
    description: "Seconds a zone must be continuously unoccupied before a zone_gap event fires"

  - key: gap_confidence_threshold
    label: Gap Confidence Threshold
    type: number
    default: 0.8
    description: "Minimum detection confidence required to count as coverage for debounce purposes (per Phase 2 spec)"

  - key: presence_events
    label: Presence Events (security alerts)
    type: boolean
    default: true
    description: "Also emit fast zone_person_present / zone_person_cleared readings, which the rules engine's security alerts (restricted areas, closed hours, door/window entry, hiding) are built on. Off = coverage events only."

  - key: presence_arrive_seconds
    label: Presence Arrival Time
    type: number
    default: 3
    description: "Seconds a person must be confidently seen before zone_person_present(arrived) fires. Higher = fewer false alarms, slower alert"

  - key: presence_clear_seconds
    label: Presence Clear Time
    type: number
    default: 30
    description: "Seconds the zone must look empty before zone_person_cleared fires"

  - key: presence_heartbeat_seconds
    label: Presence Heartbeat
    type: number
    default: 30
    description: "While a person stays in a zone, repeat zone_person_present(heartbeat) this often (lets the rules engine tell passing through from staying, and recover after a restart)"

  - key: presence_confidence
    label: Presence Confidence
    type: number
    default: 0.6
    description: "Minimum detection confidence that counts toward presence"

  - key: redis_url
    label: Redis URL
    type: string
    default: ""
    description: "If set (e.g. redis://redis:6379/0), events are published onto a Redis Stream in addition to stdout"

  - key: redis_stream
    label: Redis Stream Name
    type: string
    default: "floorwatch:events"
    description: "Redis Stream key events are XADD'd onto"

  - key: shadow_mode
    label: Shadow Mode
    type: boolean
    default: true
    description: "Log-only passthrough flag threaded onto events; real notification suppression is enforced by the downstream rules engine"

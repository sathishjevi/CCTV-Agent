name: floorwatch_app
description: Floorwatch employee app — task notifications, tracking, and status updates.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.6.0
  # Caches the Firebase settings where FloorwatchApplication.kt reads them.
  shared_preferences: ^2.3.2
  firebase_messaging: ^15.1.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/norton_root_ca.pem
